<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>3D in the browser</title>
	<link rel="icon" href="3d_sphere.png" type="image/png"/>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<style type="text/css">
		*{
			padding: 0px;
			margin: 0px;
		}
		#canv{
			display: block;
			height: 100%;
			width: 100%;
		}
	</style>
</head>
<body>
	<canvas id="canv">Your browser doesn't support this tag</canvas>

	<script src="three.js"></script>
	<script>

		let canv = document.querySelector("#canv");
		let width = window.innerWidth;
		let height = window.innerHeight;

		canv.setAttribute("width", width);
		canv.setAttribute("height", height);

		let scene = new THREE.Scene();

		let camera = new THREE.PerspectiveCamera(52, width / height, 0.1, 1000);
		camera.position.set(0, 0 ,800);

		let renderer = new THREE.WebGLRenderer({
			canvas: canv,
			alpha: true,
			antialias: true
		});
		renderer.setClearColor(0x00000);

		let light = new THREE.AmbientLight(0xffffff);
		scene.add(light);
		
		let geometry = new THREE.SphereGeometry(160, 18, 18);
		let material = new THREE.MeshNormalMaterial({wireframe: true});
		let mesh = new THREE.Mesh(geometry, material);
		scene.add(mesh);

		function render() {
			mesh.rotation.y += Math.PI / 320;

			renderer.render(scene, camera);
			requestAnimationFrame(function() {
				render();
			});
		}

		function windowResize() {
			camera.aspect = window.innerWidth / window.innerHeight;
		    camera.updateProjectionMatrix();

		    renderer.setSize(window.innerWidth, window.innerHeight);
		}

		render();
		window.addEventListener("resize", windowResize);
		
	</script>
</body>
</html>
